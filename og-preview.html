<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>OG Preview — Modibo Traoré</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif;background:#FAFAF8;position:relative}

.bg-accent{position:absolute;top:0;right:0;width:480px;height:100%;background:linear-gradient(135deg,#D85A30 0%,#B84D26 100%);clip-path:polygon(20% 0,100% 0,100% 100%,0% 100%)}
.bg-pattern{position:absolute;top:0;right:0;width:480px;height:100%;opacity:.08;background-image:radial-circle;background:repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(255,255,255,.15) 20px,rgba(255,255,255,.15) 21px)}

.content{position:relative;z-index:1;padding:80px 80px;height:100%;display:flex;flex-direction:column;justify-content:center}

.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(216,90,48,0.12);color:#D85A30;font-size:14px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;padding:8px 18px;border-radius:100px;margin-bottom:32px;width:fit-content}
.badge::before{content:'';width:8px;height:8px;background:#D85A30;border-radius:50%}

h1{font-family:'DM Serif Display',Georgia,serif;font-size:72px;font-weight:400;line-height:1.08;color:#1A1A18;margin-bottom:20px;max-width:640px}
h1 em{font-style:italic;color:#D85A30}

.subtitle{font-size:20px;color:#5F5E5A;line-height:1.6;max-width:540px;margin-bottom:36px}

.tags{display:flex;gap:10px;flex-wrap:wrap;max-width:540px}
.tag{background:#fff;border:1px solid #D3D1C7;padding:6px 14px;border-radius:100px;font-size:13px;color:#5F5E5A;font-weight:500}
.tag.primary{background:rgba(216,90,48,0.1);border-color:rgba(216,90,48,0.2);color:#D85A30}

.right-content{position:absolute;right:60px;top:50%;transform:translateY(-50%);z-index:2;display:flex;flex-direction:column;gap:16px;align-items:flex-end}
.stat{background:rgba(255,255,255,0.95);border-radius:12px;padding:20px 28px;min-width:200px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.stat-num{font-family:'DM Serif Display',Georgia,serif;font-size:32px;color:#D85A30}
.stat-label{font-size:12px;color:#888780;text-transform:uppercase;letter-spacing:0.06em;margin-top:2px}

.url{position:absolute;bottom:40px;left:80px;font-size:14px;color:#888780;letter-spacing:0.04em}
</style>
</head>
<body>

<div class="bg-accent"></div>

<div class="content">
  <div class="badge">Disponible · RQTH</div>
  <h1>Modibo<br>Traoré</h1>
  <p class="subtitle">Développeur Backend & Full-Stack<br>4 ans d'expérience en Île-de-France</p>
  <div class="tags">
    <span class="tag primary">Symfony</span>
    <span class="tag primary">Angular</span>
    <span class="tag primary">Spring Boot</span>
    <span class="tag">PostgreSQL</span>
    <span class="tag">Docker</span>
    <span class="tag">Kubernetes</span>
  </div>
</div>

<div class="right-content">
  <div class="stat"><div class="stat-num">4+</div><div class="stat-label">Ans d'expérience</div></div>
  <div class="stat"><div class="stat-num">Bac+5</div><div class="stat-label">Titre RNCP niv. 7</div></div>
  <div class="stat"><div class="stat-num">34</div><div class="stat-label">Dépôts publics</div></div>
</div>

<div class="url">github.com/modibo-26</div>

</body>
</html>
